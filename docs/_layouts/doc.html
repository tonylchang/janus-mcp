<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Janus</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}" />{% endif %}
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* Shared shadcn / TypeUI tokens — kept in sync with index.html */
    :root {
      --background: #ffffff;
      --surface: #ffffff;
      --surface-muted: #fafafa;
      --foreground: #111827;
      --muted-foreground: #6b7280;
      --primary: #000000;
      --primary-foreground: #ffffff;
      --border: #e5e7eb;
      --border-strong: #d4d4d8;
      --ring: #111827;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
      --radius: 10px; --radius-sm: 6px; --radius-lg: 16px;
      --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "Fira Code", ui-monospace, "SF Mono", Menlo, monospace;
      --shadow-sm: 0 1px 2px 0 rgba(17, 24, 39, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a0a0a; --surface: #0f0f10; --surface-muted: #141415;
        --foreground: #fafafa; --muted-foreground: #a1a1aa;
        --primary: #ffffff; --primary-foreground: #000000;
        --border: #262626; --border-strong: #333336; --ring: #fafafa;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.7;
      color: var(--foreground);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--foreground); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--border-strong); }
    a:hover { text-decoration-color: var(--foreground); }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }
    .skip-link { position: absolute; left: -9999px; top: 8px; background: var(--primary); color: var(--primary-foreground); padding: 8px 16px; border-radius: var(--radius-sm); z-index: 100; }
    .skip-link:focus { left: 8px; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: saturate(180%) blur(12px);
      background: color-mix(in srgb, var(--background) 82%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .bar {
      max-width: 860px; margin-inline: auto;
      padding: 0 var(--space-6); height: 56px;
      display: flex; align-items: center; gap: var(--space-3);
      font-size: 14px;
    }
    .bar .brand {
      display: inline-flex; align-items: center; gap: var(--space-2);
      font-weight: 700; text-decoration: none; color: var(--foreground);
    }
    .bar .brand .glyph {
      width: 24px; height: 24px; border-radius: var(--radius-sm);
      display: grid; place-items: center;
      background: var(--primary); color: var(--primary-foreground);
      font-weight: 800; font-size: 14px;
    }
    .bar .sep { color: var(--border-strong); }
    .bar .crumb { color: var(--muted-foreground); }
    .bar .spacer { flex: 1; }
    .bar .gh { color: var(--muted-foreground); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .bar .gh:hover { color: var(--foreground); }
    .bar .gh svg { width: 16px; height: 16px; }

    /* Article */
    main { max-width: 860px; margin-inline: auto; padding: var(--space-16) var(--space-6) var(--space-12); }
    .prose { font-size: 16px; }
    .prose > *:first-child { margin-top: 0; }
    .prose h1 { font-size: clamp(30px, 5vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 var(--space-6); }
    .prose h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: var(--space-12) 0 var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--border); }
    .prose h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: var(--space-8) 0 var(--space-3); }
    .prose p { margin: var(--space-4) 0; color: var(--foreground); }
    .prose ul, .prose ol { margin: var(--space-4) 0; padding-left: var(--space-6); }
    .prose li { margin: var(--space-2) 0; }
    .prose li::marker { color: var(--muted-foreground); }
    .prose strong { font-weight: 600; }
    .prose hr { border: none; border-top: 1px solid var(--border); margin: var(--space-12) 0; }
    .prose blockquote {
      margin: var(--space-6) 0; padding: var(--space-2) var(--space-6);
      border-left: 3px solid var(--primary); color: var(--muted-foreground);
    }

    /* Inline + block code */
    .prose code {
      font-family: var(--font-mono); font-size: 0.88em;
      background: var(--surface-muted); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 0.12em 0.36em;
    }
    .prose pre {
      margin: var(--space-6) 0; padding: var(--space-4);
      background: var(--surface-muted); border: 1px solid var(--border);
      border-radius: var(--radius); overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }
    .prose pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.7; }
    .prose .highlight { margin: var(--space-6) 0; }
    .prose .highlight pre { margin: 0; }

    /* Tables */
    .prose table {
      width: 100%; border-collapse: collapse; margin: var(--space-6) 0;
      font-size: 14px; display: block; overflow-x: auto;
    }
    .prose thead th {
      text-align: left; font-weight: 600; padding: var(--space-3) var(--space-4);
      background: var(--surface-muted); border-bottom: 1px solid var(--border-strong);
      white-space: nowrap;
    }
    .prose tbody td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); vertical-align: top; }
    .prose tbody tr:last-child td { border-bottom: none; }
    .prose td code, .prose th code { white-space: nowrap; }

    /* Footer */
    footer { border-top: 1px solid var(--border); }
    .foot {
      max-width: 860px; margin-inline: auto; padding: var(--space-8) var(--space-6);
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
      flex-wrap: wrap; font-size: 14px; color: var(--muted-foreground);
    }
    .foot a { color: var(--muted-foreground); }
    .foot a:hover { color: var(--foreground); }
    .foot nav { display: flex; gap: var(--space-6); }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header>
    <div class="bar">
      <a class="brand" href="./" aria-label="Janus home">
        <span class="glyph" aria-hidden="true">J</span>
        Janus
      </a>
      <span class="sep" aria-hidden="true">/</span>
      <span class="crumb">{{ page.title }}</span>
      <span class="spacer"></span>
      <a class="gh" href="https://github.com/tonylchang/janus-mcp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C18.6 4 19.6 4.3 19.6 4.3c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5Z"/></svg>
        GitHub
      </a>
    </div>
  </header>

  <main id="content">
    <article class="prose">
      {{ content }}
    </article>
  </main>

  <footer>
    <div class="foot">
      <span>Janus — two faces. One cluster. No exposed keys.</span>
      <nav aria-label="Docs">
        <a href="./">Home</a>
        <a href="quickstart.html">Quick start</a>
        <a href="runbook.html">Runbook</a>
        <a href="threat-model.html">Threat model</a>
      </nav>
    </div>
  </footer>
</body>
</html>
