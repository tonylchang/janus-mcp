name: release

# Publishes to PyPI via Trusted Publishing (OIDC — no API tokens stored).
# One-time setup on pypi.org: project settings -> Publishing -> add GitHub
# publisher (owner: tonylchang, repo: janus-mcp, workflow: release.yml,
# environment: pypi).
#
# To release: bump `version` in pyproject.toml, tag `vX.Y.Z`, push the tag.
#
# Actions are pinned by commit SHA (the tag comment is informational).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: verify tag matches package version
        run: |
          PACKAGE_VERSION=$(uv run python -c 'from importlib.metadata import version; print(version("janus-mcp-server"))')
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: audit dependencies (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=uv.lock
      - run: uv build
      - name: smoke-test wheel
        run: uv run --isolated --with dist/janus_mcp_server-*.whl janus-mcp --help
      - run: mkdir -p artifacts
      - name: generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: artifacts/janus-mcp.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            artifacts/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
      - name: create signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* artifacts/* --verify-tag --generate-notes
