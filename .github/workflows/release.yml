name: release

# Publishes to PyPI via Trusted Publishing (OIDC — no API tokens stored).
# One-time setup on pypi.org: project settings -> Publishing -> add GitHub
# publisher (owner: tonylchang, repo: janus-mcp, workflow: release.yml,
# environment: pypi).
#
# To release: bump `version` in pyproject.toml, tag `vX.Y.Z`, push the tag.
#
# Actions are pinned by commit SHA (the tag comment is informational).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check . && uv run mypy && uv run pytest -q
      - name: audit dependencies (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=uv.lock
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # MCP Registry entry: version is derived from the tag (server.json in the
  # repo is the template). Runs after BOTH artifact publishes because the
  # registry validates that the PyPI package and the OCI image actually exist.
  # Auth is GitHub OIDC — no stored tokens. The publisher binary is pinned by
  # version + sha256 like every other dependency in this pipeline.
  mcp-registry:
    needs: [publish, docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to the registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install mcp-publisher (pinned)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: set versions from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | (.packages[] | select(.registryType == "pypi") | .version) = $v
            | (.packages[] | select(.registryType == "oci") | .identifier)
                = "ghcr.io/tonylchang/janus-mcp:" + $tag
          ' server.json > server.tmp && mv server.tmp server.json
      - run: ./mcp-publisher login github-oidc
      - name: publish (retry for PyPI propagation)
        run: |
          for i in 1 2 3 4; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1

  # Container image on GHCR: same gate (needs: build), multi-arch, tagged with
  # the release version and :latest. Base images are digest-pinned in the
  # Dockerfile; the lockfile governs Python dependencies inside the image.
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/janus-mcp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/janus-mcp:latest
