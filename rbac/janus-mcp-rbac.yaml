# Least-privilege RBAC for janus-mcp.
#
# Run the server with a kubeconfig bound to this ServiceAccount — never
# cluster-admin. Note what is absent: secrets. Nowhere. Ever.
#
# Apply, then repeat the Role + RoleBinding per allowed namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: janus-mcp
  namespace: janus-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: janus-mcp-namespace-read
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: janus-mcp-namespace-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: janus-mcp-namespace-read
subjects:
  - kind: ServiceAccount
    name: janus-mcp
    namespace: janus-mcp
---
# Repeat this Role + RoleBinding for every namespace in scope.allowed_namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: janus-mcp
  namespace: prod
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - configmaps
      - persistentvolumeclaims
      - endpoints
      - resourcequotas
      - limitranges
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  # get_resource_usage (safe to omit if metrics-server is not installed)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: janus-mcp
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: janus-mcp
subjects:
  - kind: ServiceAccount
    name: janus-mcp
    namespace: janus-mcp
---
# ONLY apply this Role if write tools are enabled in the janus-mcp config.
# Each rule maps to specific tools — trim it to the tools you actually enable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: janus-mcp-write
  namespace: prod
rules:
  # rollout_restart, scale_deployment, rollout_undo
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - statefulsets
      - statefulsets/scale
      - daemonsets
    verbs: ["patch"]
  # delete_pod
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # set_cronjob_suspend / trigger_cronjob
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: janus-mcp-write
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: janus-mcp-write
subjects:
  - kind: ServiceAccount
    name: janus-mcp
    namespace: janus-mcp
---
# ONLY apply if BOTH scope.allow_cluster_scoped AND the cordon_node write tool
# are enabled. Node describe/list needs the read half; cordon needs patch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: janus-mcp-cluster-scoped
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # node metrics for the cluster summary / usage views (optional)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # cordon_node only:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: janus-mcp-cluster-scoped
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: janus-mcp-cluster-scoped
subjects:
  - kind: ServiceAccount
    name: janus-mcp
    namespace: janus-mcp
